<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Entry System</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Entry">

  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    /* ===== loading screen ===== */
    .splash {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 20;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }
    .splash.hide { opacity: 0; pointer-events: none; }
    .splash img { width: 180px; height: 180px; border-radius: 34px; }
    .splash .loading {
      margin-top: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      font-size: 14px;
      letter-spacing: 3px;
      color: #777;
      animation: fadeLoop 1.6s ease-in-out infinite;
    }
    @keyframes fadeLoop {
      0%, 100% { opacity: 0.15; }
      50%      { opacity: 1; }
    }

    /* ===== no internet screen ===== */
    .offline {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 30;
      background: #ffffff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      color: #444;
    }
    .offline.show { display: flex; }
    .offline img { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 16px; }
    .offline h2 { font-size: 18px; margin: 0 0 6px; }
    .offline p { font-size: 13px; color: #777; margin: 0; }
    .offline button {
      margin-top: 16px; padding: 10px 24px;
      border: none; border-radius: 10px;
      background: #29B6F6; color: #fff;
      font-size: 14px; font-weight: 700;
    }
  </style>
</head>
<body>

  <iframe id="app" src="https://script.google.com/macros/s/AKfycbzR2g7WsA4NVN1jccjh8WTS5YcAkkJmIRoU60Jz7kN92l2d7zzJaIAyh7-Q9IJo6MmNOw/exec" allow="camera; fullscreen; vibrate"></iframe>

  <div class="splash" id="splash">
    <img src="icon-512.png" alt="">
    <div class="loading" id="splashText"><b>Loading...</b></div>
  </div>

  <div class="offline" id="offline">
    <img src="icon-192.png" alt="">
    <h2>No internet connection</h2>
    <p>The app needs internet to check guests in.</p>
    <button onclick="retry()">Try again</button>
  </div>

  <script>
    var frame = document.getElementById('app');
    var box = document.getElementById('offline');
    var splash = document.getElementById('splash');
    var splashText = document.getElementById('splashText');

    var EXEC = frame.getAttribute('src').split('?')[0];
    var MIN_MS = 1200;    // show the loading screen at least this long
    var MAX_MS = 15000;   // never keep it longer than this
    var shownAt = Date.now();
    var maxTimer = null;

    function setTheme(dark) {
      var c = dark ? '#26282c' : '#ffffff';
      document.querySelector('meta[name="theme-color"]').setAttribute('content', c);
      document.documentElement.style.background = c;
      document.body.style.background = c;
      splash.style.background = c;
      splashText.style.color = dark ? '#b0b3b8' : '#777';
      try { localStorage.setItem('wrapTheme', dark ? 'dark' : 'light'); } catch (e) {}
    }

    function showSplash() {
      shownAt = Date.now();
      splash.classList.remove('hide');
      clearTimeout(maxTimer);
      maxTimer = setTimeout(hideSplash, MAX_MS);
    }

    function hideSplash() {
      clearTimeout(maxTimer);
      var wait = Math.max(0, MIN_MS - (Date.now() - shownAt));
      setTimeout(function () { splash.classList.add('hide'); }, wait);
    }

    function check() {
      box.classList.toggle('show', !navigator.onLine);
    }
    function retry() {
      if (navigator.onLine) {
        showSplash();
        frame.src = frame.src;   // reload the app
        box.classList.remove('show');
      } else {
        check();
      }
    }
    window.addEventListener('online', retry);
    window.addEventListener('offline', check);

    // backup: if the app never says it is ready, hide the loading screen after the page loads
    frame.addEventListener('load', function () { setTimeout(hideSplash, 6000); });

    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d) return;

      if (d.type === 'qr-theme') {      // the app is ready and tells us its theme
        setTheme(!!d.dark);
        hideSplash();
        return;
      }

      if (d.type !== 'qr-nav') return;
      if (d.page !== '' && d.page !== 'admin') return;
      showSplash();
      frame.src = EXEC + (d.page ? '?page=' + d.page : '');
    });

    // start-up
    var startDark = false;
    try { startDark = localStorage.getItem('wrapTheme') === 'dark'; } catch (e) {}
    setTheme(startDark);
    showSplash();
    check();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
