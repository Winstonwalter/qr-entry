<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Entry System</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Entry">

  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; }
    iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .offline {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10;
      background: #ffffff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      color: #444;
    }
    .offline.show { display: flex; }
    .offline img { width: 96px; height: 96px; border-radius: 20px; margin-bottom: 16px; }
    .offline h2 { font-size: 18px; margin: 0 0 6px; }
    .offline p { font-size: 13px; color: #777; margin: 0; }
    .offline button {
      margin-top: 16px; padding: 10px 24px;
      border: none; border-radius: 10px;
      background: #29B6F6; color: #fff;
      font-size: 14px; font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- >>> REPLACE THE TEXT BELOW WITH YOUR REAL /exec LINK (copy it from your old index.html) <<< -->
  <iframe id="app" src="https://script.google.com/macros/s/AKfycbzR2g7WsA4NVN1jccjh8WTS5YcAkkJmIRoU60Jz7kN92l2d7zzJaIAyh7-Q9IJo6MmNOw/exec" allow="camera; fullscreen; vibrate"></iframe>

  <div class="offline" id="offline">
    <img src="icon-192.png" alt="">
    <h2>No internet connection</h2>
    <p>The app needs internet to check guests in.</p>
    <button onclick="retry()">Try again</button>
  </div>

  <script>
    var frame = document.getElementById('app');
    var box = document.getElementById('offline');

    function check() {
      box.classList.toggle('show', !navigator.onLine);
    }
    function retry() {
      if (navigator.onLine) {
        frame.src = frame.src;   // reload the app
        box.classList.remove('show');
      } else {
        check();
      }
    }
    window.addEventListener('online', retry);
    window.addEventListener('offline', check);
    check();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
